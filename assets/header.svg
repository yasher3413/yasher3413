<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Yash Gandhi: live broadcast">
  <title>YASH GANDHI: LIVE</title>
  <defs>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="14" height="14" fill="#0b1020"/>
      <rect width="2" height="14" fill="#111831"/>
    </pattern>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ffb21f"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="frame"><rect width="880" height="300" rx="14"/></clipPath>
    <clipPath id="tickerclip"><rect x="128" y="262" width="752" height="38"/></clipPath>
    <style>
      .f{font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
      @keyframes slide{from{transform:translateX(-900px)}to{transform:translateX(0)}}
      @keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
      @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-5777px)}}
      @keyframes scan{from{transform:translateY(-300px)}to{transform:translateY(300px)}}
      .live{animation:blink 1.2s infinite}
      .name1{animation:rise .6s cubic-bezier(.2,.9,.3,1.2) .1s both}
      .name2{animation:rise .6s cubic-bezier(.2,.9,.3,1.2) .35s both}
      .lower{animation:slide .7s cubic-bezier(.2,.9,.3,1) .7s both}
      .ticker{animation:tick 83s linear infinite}
      .scan{animation:scan 6s linear infinite}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="300" fill="url(#stripes)"/>
    <!-- giant ghost jersey number -->
    <text x="860" y="245" text-anchor="end" class="f" font-size="260" fill="none" stroke="#1c2647" stroke-width="3" font-style="italic">34</text>
    <rect class="scan" width="880" height="60" fill="#ffffff" opacity=".025"/>
    <rect width="880" height="300" fill="url(#fade)"/>

    <!-- top bar -->
    <g transform="translate(24,22)">
      <rect width="78" height="26" rx="4" fill="#e11d2e"/>
      <circle class="live" cx="15" cy="13" r="5" fill="#fff"/>
      <text x="27" y="18.5" class="f" font-size="14" fill="#fff" letter-spacing="1">LIVE</text>
      <text x="92" y="18.5" class="m" font-size="12" fill="#8b97c7" letter-spacing="1">FROM SOMEWHERE WITH TOO MANY TABS OPEN</text>
    </g>

    <!-- scorebug -->
    <g transform="translate(616,18)">
      <rect width="240" height="34" rx="5" fill="#05070f" stroke="#26315a"/>
      <text x="14" y="22.5" class="f" font-size="13" fill="#fff">REPOS</text>
      <text x="74" y="23" class="f" font-size="16" fill="#ffb21f">18</text>
      <rect x="101" y="6" width="1" height="22" fill="#26315a"/>
      <text x="112" y="22.5" class="f" font-size="13" fill="#fff">SLEEP</text>
      <text x="168" y="23" class="f" font-size="16" fill="#ff5a1f">0</text>
      <rect x="187" y="6" width="1" height="22" fill="#26315a"/>
      <text x="196" y="22.5" class="m" font-size="12" fill="#8b97c7">Q4</text>
    </g>

    <!-- name -->
    <g transform="skewX(-9)">
      <text class="f name1" x="62" y="140" font-size="78" fill="#ffffff" letter-spacing="-2">YASH</text>
      <text class="f name2" x="302" y="140" font-size="78" fill="#ff7a1f" letter-spacing="-2">GANDHI</text>
    </g>

    <!-- lower third -->
    <g class="lower">
      <polygon points="0,162 640,162 616,206 0,206" fill="url(#bar)"/>
      <text x="40" y="191" class="f" font-size="17" fill="#0b1020" letter-spacing=".5">BUILDER · TAB HOARDER · DEPRESSED SPORTS FAN</text>
      <polygon points="0,206 520,206 506,232 0,232" fill="#05070f"/>
      <text x="40" y="224" class="m" font-size="13" fill="#c9d2f5">ships agents, browsers &amp; flipper firmware · zero (0) rings</text>
    </g>

    <!-- ticker -->
    <rect y="262" width="880" height="38" fill="#05070f"/>
    <rect y="262" width="880" height="2" fill="url(#bar)"/>
    <g clip-path="url(#tickerclip)">
      <g class="ticker">
        <text x="140" y="287" class="m" font-size="15" fill="#e8ecff" textLength="5777" lengthAdjust="spacing" xml:space="preserve">FLIPPERCLAW: local man stuffs an LLM agent into a Flipper Zero, insists it's &quot;for productivity&quot;   ✦   TWIG: dev with 300 open tabs builds an entire browser rather than close a single one   ✦   TABLED: Canadian federal bills now summarized faster than MPs can skim them   ✦   SEA-TRIP: hires an AI chief of staff to plan one (1) vacation   ✦   SOURCES: yash's teams &quot;have a real shot this year&quot; (they do not)   ✦   FANTASY: draft-aid repo shipped, team still finishes 9th of 10   ✦   CLAW-CODE: being rewritten in Rust, as is tradition   ✦   INJURY REPORT: wrists questionable, sleep schedule OUT indefinitely   ✦   </text>
        <text x="5917" y="287" class="m" font-size="15" fill="#e8ecff" textLength="5777" lengthAdjust="spacing" xml:space="preserve">FLIPPERCLAW: local man stuffs an LLM agent into a Flipper Zero, insists it's &quot;for productivity&quot;   ✦   TWIG: dev with 300 open tabs builds an entire browser rather than close a single one   ✦   TABLED: Canadian federal bills now summarized faster than MPs can skim them   ✦   SEA-TRIP: hires an AI chief of staff to plan one (1) vacation   ✦   SOURCES: yash's teams &quot;have a real shot this year&quot; (they do not)   ✦   FANTASY: draft-aid repo shipped, team still finishes 9th of 10   ✦   CLAW-CODE: being rewritten in Rust, as is tradition   ✦   INJURY REPORT: wrists questionable, sleep schedule OUT indefinitely   ✦   </text>
      </g>
    </g>
    <polygon points="0,262 120,262 132,300 0,300" fill="#ffb21f"/>
    <text x="16" y="287" class="f" font-size="14" fill="#0b1020" letter-spacing="1">BREAKING</text>
  </g>
</svg>
