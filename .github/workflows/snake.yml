name: film room (snake)

on:
  schedule:
    - cron: "43 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff5a1f&color_dots=#ebedf0,#ffe0c2,#ffb27a,#ff7a1f,#c2410c
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb21f&color_dots=#161b22,#4a2412,#8a3a12,#d9581a,#ff8a3d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
